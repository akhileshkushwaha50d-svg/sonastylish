<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sonastylhh - Fashion & Style</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        header { background: #333; color: white; padding: 1rem; text-align: center; }
        nav { display: flex; justify-content: center; gap: 1rem; }
        nav a { color: white; text-decoration: none; }
        .hero { background: url('https://via.placeholder.com/1200x400?text=Welcome+to+sonastylhh') center/cover; height: 400px; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; padding: 2rem; }
        .product { background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
        .product img { width: 100%; height: 200px; object-fit: cover; }
        footer { background: #333; color: white; text-align: center; padding: 1rem; }
    </style>
</head>
<body>
    <header>
        <h1>sonastylhh</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    
    <section class="hero">
        <h2>Discover Style with sonastylhh</h2>
    </section>
    
    <section class="products">
        <div class="product">
            <img src="https://via.placeholder.com/250x200?text=Product+1" alt="Product 1">
            <h3>Stylish Dress</h3>
            <p>$50</p>
            <button>Add to Cart</button>
        </div>
        <div class="product">
            <img src="https://via.placeholder.com/250x200?text=Product+2" alt="Product 2">
            <h3>Elegant Jewelry</h3>
            <p>$30</p>
            <button>Add to Cart</button>
        </div>
        <!-- Add more products here -->
    </section>
    
    <footer>
        <p>Follow sonastylhh on Instagram | © 2023 sonastylhh</p>
    </footer>
    
    <script>
        // Simple JS for interactivity (e.g., cart simulation)
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => alert('Added to cart on sonastylhh!'));
        });
    </script>
</body>
</html>
